name: Play Store Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release-aab:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm cache clean --force || true
          rm -rf node_modules
          # Install legacy peer deps to handle version mismatches
          npm install --legacy-peer-deps
          # CRITICAL: Install missing dependencies causing Metro bundler failures
          npm install react-native-gesture-handler --legacy-peer-deps
          npm install expo-modules-core@latest --legacy-peer-deps
          # Ensure build-time dependencies are present
          npm install --save-dev metro-react-native-babel-transformer@^0.76.0 @babel/preset-flow@^7.24.0 --legacy-peer-deps

      - name: 🏗️ Generate Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Create Global Gradle Fix Script (Kotlin + SDK)
        run: |
          # This script forces SDK 34 and Kotlin 1.9.20 on ALL modules
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-sdk.gradle << 'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 34
                          buildToolsVersion "34.0.0"
                          defaultConfig {
                              minSdkVersion 24
                              targetSdkVersion 34
                          }
                      }
                  }
              }
              // Force Kotlin version resolution strategy
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '1.9.20'
                      }
                  }
              }
          }
          EOF
          echo "✅ Global Gradle init script created to force SDK 34 & Kotlin 1.9.20"

      - name: 🔧 Patch Root Build Gradle
        run: |
          # Explicitly set Kotlin version in the root build.gradle file
          if [ -f "android/build.gradle" ]; then
             sed -i 's/ext.kotlinVersion = .*$/ext.kotlinVersion = "1.9.20"/g' android/build.gradle
             echo "✅ Patched root android/build.gradle kotlinVersion"
          fi

      - name: 🔧 Apply Gradle Properties
        run: |
          # Add performance flags and disable Flipper
          echo "" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "FLIPPER_VERSION=" >> android/gradle.properties
          echo "kotlin.version=1.9.20" >> android/gradle.properties

      - name: 🔐 Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: 🔨 Build Release AAB
        env:
          ORG_GRADLE_PROJECT_storeFile: upload-keystore.jks
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace --no-daemon
        timeout-minutes: 30

      - name: 📝 Setup Google Play Credentials
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: 🚀 Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: com.rppauto.mobileapp
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
