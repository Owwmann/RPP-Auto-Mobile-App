name: 🚀 Play Store Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: 📦 Install Dependencies
        run: |
          rm -rf node_modules package-lock.json yarn.lock
          npm install --legacy-peer-deps --no-audit

      - name: 🧹 Clean Android folder
        run: rm -rf android

      - name: 🏗️ Generate Android Project
        run: |
          npx expo prebuild --clean --platform android
          chmod +x android/gradlew

      - name: ⚙️ Configure Gradle & Fix ALL Expo modules
        run: |
          # Add Gradle memory configuration
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.configureondemand=false" >> android/gradle.properties

          # Patch ALL Expo modules with SDK configuration
          echo "🔧 Patching ALL Expo modules..."
          for module in node_modules/expo-*/android/build.gradle; do
            if [ -f "$module" ]; then
              sed -i '/^android {/a\    compileSdkVersion 34\n    buildToolsVersion "34.0.0"' "$module"
              if grep -q "defaultConfig {" "$module"; then
                sed -i '/defaultConfig {/a\        targetSdkVersion 34\n        minSdkVersion 24' "$module"
              fi
              echo "  ✓ $(basename $(dirname $(dirname $module)))"
            fi
          done
          echo "✅ ALL Expo modules patched with SDK config"

      - name: 🏗️ Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace --no-daemon
          echo "✅ AAB built successfully"

      - name: 🔐 Sign AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 📦 Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpp-auto-release-signed-aab
          path: ${{steps.sign_aab.outputs.signedReleaseFile}}
          retention-days: 90

      - name: 🎉 Build Complete
        run: |
          echo "🎉 Play Store-ready AAB created successfully!"
          echo "📲 Download from Artifacts section above"
          echo "🏪 Ready to upload to Google Play Console"
          ls -lh ${{steps.sign_aab.outputs.signedReleaseFile}}
