name: 🚀 Play Store Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: 📦 Clean Install Dependencies
        run: |
          rm -rf node_modules package-lock.json yarn.lock android/.gradle
          npm install --legacy-peer-deps --no-audit
          npm list expo-modules-core || true
          echo "✅ Dependencies installed"

      - name: 🔨 Prebuild Android Project
        run: |
          npx expo prebuild --platform android --clean
          
          if [ ! -d "android" ]; then
            echo "❌ ERROR: android folder not created!"
            exit 1
          fi
          
          echo "✅ Android project created"
          ls -la android/

      - name: 🔧 Fix Gradle Configuration
        run: |
          echo "📝 Fixing Gradle configuration..."
          
          # Fix android/build.gradle - add compileSdkVersion if missing
          if ! grep -q "compileSdkVersion" android/build.gradle; then
            echo "Adding buildscript and compileSdkVersion to android/build.gradle..."
            cat > android/build.gradle.tmp << 'EOF'
buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("com.google.gms:google-services:4.4.0")
    }
}

apply plugin: "com.android.application"
apply plugin: "kotlin-android"

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
EOF
            mv android/build.gradle android/build.gradle.old
            mv android/build.gradle.tmp android/build.gradle
          fi
          
          # Fix android/app/build.gradle - ensure proper publishing configuration
          echo "Fixing android/app/build.gradle..."
          sed -i '/components.release/d' android/app/build.gradle || true
          
          echo "✅ Gradle configuration fixed"
          ls -la android/

      - name: 🛠️ Make gradlew Executable
        run: chmod +x android/gradlew

      - name: 🏗️ Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace
          echo "✅ AAB built successfully"

      - name: 🔐 Sign AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 📦 Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpp-auto-release-signed-aab
          path: ${{steps.sign_aab.outputs.signedReleaseFile}}
          retention-days: 90

      - name: 🎉 Build Complete
        run: |
          echo "🎉 Play Store-ready AAB created successfully!"
          echo "📲 Download from Artifacts section above"
          echo "🏪 Ready to upload to Google Play Console"
          ls -lh ${{steps.sign_aab.outputs.signedReleaseFile}}
