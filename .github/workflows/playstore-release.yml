name: Play Store Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release-aab:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: 📦 Install Dependencies
        run: |
          npm cache clean --force || true
          rm -rf node_modules
          npm install --force

      - name: 🏗️ Generate Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Inject Flipper Properties (Critical Fix)
        run: |
          echo "Injecting missing Flipper versions into gradle.properties..."
          echo "FLIPPER_VERSION=0.182.0" >> android/gradle.properties
          echo "FLIPPER_SOCKET_VERSION=0.182.0" >> android/gradle.properties
          echo "FLIPPER_FRESCO_VERSION=2.5.0" >> android/gradle.properties

          # Verification
          echo "✅ Verified properties:"
          tail -n 5 android/gradle.properties

      - name: 🔧 Fix settings.gradle for Expo
        run: |
          echo "Removing incompatible React Native CLI plugin..."
          echo "BEFORE:"
          cat android/settings.gradle
          # Try multiple patterns to catch all variations
          sed -i "/id.*'com\.facebook\.react\.settings'/d" android/settings.gradle
          sed -i '/id.*"com\.facebook\.react\.settings"/d' android/settings.gradle
          sed -i "/id('com\.facebook\.react\.settings')/d" android/settings.gradle
          sed -i '/id("com\.facebook\.react\.settings")/d' android/settings.gradle
          sed -i '/com\.facebook\.react\.settings/d' android/settings.gradle
          echo ""
          echo "AFTER:"
          cat android/settings.gradle
          echo ""
          if grep -q "facebook.*react.*settings" android/settings.gradle; then
            echo "❌ ERROR: facebook.react.settings still present!"
            exit 1
          fi
          echo "✅ Patched settings.gradle for Expo SDK compatibility"

      - name: 🔐 Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: 🔨 Build Release AAB
        env:
          ORG_GRADLE_PROJECT_storeFile: upload-keystore.jks
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace --no-daemon
        timeout-minutes: 30

      - name: 📝 Setup Google Play Credentials
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: 🚀 Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: com.rppauto.mobileapp
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
