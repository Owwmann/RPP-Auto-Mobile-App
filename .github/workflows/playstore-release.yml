name: Play Store Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release-aab:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🧹 Clean npm cache and fresh install
        run: |
          echo "🧹 Cleaning npm cache to fix React Native bundler issues..."
          npm cache clean --force
          rm -rf node_modules package-lock.json
          echo "📦 Fresh install with legacy peer deps..."
          npm install --legacy-peer-deps
          echo "✅ Dependencies installed cleanly"

      - name: 🔧 Patch expo-constants
        run: |
          echo "📝 Patching expo-constants/android/build.gradle..."
          TARGET_FILE="node_modules/expo-constants/android/build.gradle"
          if [ -f "$TARGET_FILE" ]; then
            echo "" >> "$TARGET_FILE"
            echo "android { compileSdkVersion 34; buildToolsVersion \"34.0.0\"; defaultConfig { minSdkVersion 24; targetSdkVersion 34 } }" >> "$TARGET_FILE"
            echo "✅ Patch applied successfully to $TARGET_FILE"
            tail -n 5 "$TARGET_FILE"
          else
            echo "❌ Error: $TARGET_FILE not found!"
            exit 1
          fi

      - name: 🔧 Create Gradle Init Script
        run: |
          echo "📝 Creating global Gradle init script for SDK versions..."
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sdk-versions.gradle << 'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (!compileSdkVersion) {
                              compileSdkVersion 34
                              buildToolsVersion "34.0.0"
                          }
                          if (defaultConfig && !defaultConfig.minSdkVersion) {
                              defaultConfig {
                                  minSdkVersion 24
                                  targetSdkVersion 34
                              }
                          }
                      }
                  }
              }
          }
          EOF
          echo "✅ Gradle init script created at ~/.gradle/init.d/sdk-versions.gradle"
          cat ~/.gradle/init.d/sdk-versions.gradle

      - name: 🏗️ Generate Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Inject FLIPPER_VERSION into Gradle Properties
        run: |
          echo "📝 Appending FLIPPER_VERSION to android/gradle.properties..."
          echo "" >> android/gradle.properties
          echo "# Flipper configuration injected by CI" >> android/gradle.properties
          echo "FLIPPER_VERSION=0.182.0" >> android/gradle.properties
          echo "✅ Flipper version injected successfully."
          cat android/gradle.properties

      - name: 🎯 ACCURATE FIX - Update minSdkVersion in PROJECT-LEVEL build.gradle
        run: |
          echo "🎯 ACCURATE FIX: Updating minSdkVersion in android/build.gradle (project-level)"
          PROJECT_BUILD_GRADLE="android/build.gradle"
          
          if [ -f "$PROJECT_BUILD_GRADLE" ]; then
            echo "📋 Original ext block:"
            grep -A 10 "ext {" "$PROJECT_BUILD_GRADLE" | head -15 || echo "ext block not found in expected format"
            
            # Replace minSdkVersion = 23 with minSdkVersion = 24 in the ext block
            sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' "$PROJECT_BUILD_GRADLE"
            sed -i 's/minSdkVersion=23/minSdkVersion=24/g' "$PROJECT_BUILD_GRADLE"
            sed -i 's/minSdkVersion: 23/minSdkVersion: 24/g' "$PROJECT_BUILD_GRADLE"
            
            echo ""
            echo "✅ minSdkVersion updated to 24 in PROJECT-LEVEL build.gradle"
            echo "📋 Updated ext block:"
            grep -A 10 "ext {" "$PROJECT_BUILD_GRADLE" | head -15 || echo "ext block not found"
          else
            echo "❌ Error: $PROJECT_BUILD_GRADLE not found!"
            exit 1
          fi

      - name: 🔐 Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo "Decoding keystore file..."
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          ls -l android/app/upload-keystore.jks

      - name: 🏗️ Build Release AAB
        env:
          ORG_GRADLE_PROJECT_storeFile: upload-keystore.jks
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace -x lint -x lintVitalRelease

      - name: 🔐 Setup Google Play Credentials
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: 📤 Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: com.rppauto.mobileapp
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
