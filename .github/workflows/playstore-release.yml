name: Play Store Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release-aab:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install Dependencies
        run: |
          npm cache clean --force || true
          rm -rf node_modules
          npm install --legacy-peer-deps
          npm install --save-dev metro-react-native-babel-transformer@^0.76.0 @babel/preset-flow@^7.24.0 --legacy-peer-deps

      - name: Verify React Native Installation
        run: |
          if [ ! -f "node_modules/react-native/index.js" ]; then
            echo "React Native not found. Reinstalling..."
            npm install react-native --legacy-peer-deps
          fi

      - name: Create Gradle Init Script
        run: |
          mkdir -p ~/.gradle/init.d
          echo "allprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android { if (!compileSdkVersion) { compileSdkVersion 34; buildToolsVersion '34.0.0' } if (defaultConfig && !defaultConfig.minSdkVersion) { defaultConfig { minSdkVersion 24; targetSdkVersion 34 } } } } } }" > ~/.gradle/init.d/sdk-versions.gradle

      - name: Generate Android Project
        run: npx expo prebuild --platform android --clean

      - name: Apply Post-Prebuild Fixes
        run: |
          echo "--- Applying Kotlin Fixes ---"
          sed -i 's/kotlinVersion = "1.8.0"/kotlinVersion = "1.9.20"/g' android/build.gradle || true
          sed -i 's/kotlinVersion = "1.9.24"/kotlinVersion = "1.9.20"/g' android/build.gradle || true

          echo "--- Injecting Gradle Properties ---"
          echo "" >> android/gradle.properties
          echo "# React Native Bridge Flags" >> android/gradle.properties
          echo "hermesEnabled=true" >> android/gradle.properties
          echo "newArchEnabled=false" >> android/gradle.properties
          echo "expo.useLegacyPackageStructure=false" >> android/gradle.properties

          echo "# Memory Optimization for CI" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

          echo "--- Injecting Flipper Version ---"
          echo "FLIPPER_VERSION=0.182.0" >> android/gradle.properties

          echo "--- Setting minSdkVersion ---"
          echo "android.minSdkVersion=24" >> android/gradle.properties

          echo "--- Verification ---"
          tail -n 15 android/gradle.properties

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Build Release AAB
        env:
          ORG_GRADLE_PROJECT_storeFile: upload-keystore.jks
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace -x lint -x lintVitalRelease

      - name: Setup Google Play Credentials
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: com.rppauto.mobileapp
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
