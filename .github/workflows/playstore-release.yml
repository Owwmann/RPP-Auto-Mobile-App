name: Play Store Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release-aab:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: 📦 Install Dependencies
        run: |
          npm cache clean --force || true
          rm -rf node_modules
          npm install --legacy-peer-deps
          # Ensure build-time dependencies are present
          npm install --save-dev metro-react-native-babel-transformer@^0.76.0 @babel/preset-flow@^7.24.0 --legacy-peer-deps

      - name: 🔧 Create Global Gradle Fix Script
        run: |
          # This script forces SDK versions on ALL modules (fixing the :expo compileSdkVersion error)
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-sdk.gradle << 'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 34
                          buildToolsVersion "34.0.0"
                          defaultConfig {
                              minSdkVersion 24
                              targetSdkVersion 34
                          }
                      }
                  }
              }
          }
          EOF
          echo "✅ Global Gradle init script created to force SDK 34"

      - name: 🏗️ Generate Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Apply Gradle Properties & Disable Flipper
        run: |
          # Add performance flags
          echo "" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          
          # Fix Kotlin version if needed
          sed -i 's/kotlinVersion = "1.8.0"/kotlinVersion = "1.9.20"/g' android/build.gradle || true
          sed -i 's/kotlinVersion = "1.9.24"/kotlinVersion = "1.9.20"/g' android/build.gradle || true
          
          # Disable Flipper completely by removing the dependency
          if [ -f "android/settings.gradle" ]; then
            sed -i '/react-native-flipper/d' android/settings.gradle
          fi
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i '/react-native-flipper/d' android/settings.gradle.kts
          fi

      - name: 🔐 Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: 🔨 Build Release AAB
        env:
          ORG_GRADLE_PROJECT_storeFile: upload-keystore.jks
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace --no-daemon
        timeout-minutes: 30

      - name: 📝 Setup Google Play Credentials
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: 🚀 Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: com.rppauto.mobileapp
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
