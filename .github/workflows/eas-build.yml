name: EAS Build - Android (Self-Provisioning)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile to use'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - preview
          - production
      auto_submit:
        description: 'Auto-submit to Play Store (production only)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - main
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - 'package.json'
      - 'eas.json'
      - 'app.json'

jobs:
  build:
    name: Build Android App (Self-Provisioning)
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: ☕ Setup Java (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: 🔐 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: 🔑 Generate Android Keystore
        run: |
          echo "📝 Generating production keystore..."
          keytool -genkeypair -v \
            -keystore production.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias rpp_alias \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=RPP Auto, OU=Mobile, O=RPP, L=USA, C=US"
          echo "✅ Keystore generated successfully"
          ls -lh production.jks
      
      - name: ⬆️ Upload Keystore to Expo
        run: |
          echo "📤 Uploading keystore credentials to Expo..."
          npx eas-cli credentials:create \
            --platform android \
            --type keystore \
            --keystore-path production.jks \
            --keystore-password password123 \
            --key-alias rpp_alias \
            --key-password password123 \
            --non-interactive
          echo "✅ Keystore credentials uploaded"
      
      - name: 🚀 Run EAS Build (Non-Interactive)
        run: |
          eas build --platform android \
            --profile ${{ github.event.inputs.profile || 'production' }} \
            --non-interactive \
            --no-wait
      
      - name: 📊 Get Build Status
        id: build-status
        run: |
          echo "Getting latest build status..."
          BUILD_ID=$(eas build:list --platform android --limit 1 --json | jq -r '.[0].id')
          BUILD_URL=$(eas build:list --platform android --limit 1 --json | jq -r '.[0].artifacts.buildUrl // "pending"')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"
          echo "Build URL: $BUILD_URL"
      
      - name: 📤 Submit to Play Store
        if: ${{ github.event.inputs.auto_submit == 'true' && github.event.inputs.profile == 'production' }}
        run: eas submit --platform android --latest --non-interactive
      
      - name: 📋 Build Summary
        run: |
          echo "## 🎉 Build Initiated Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ github.event.inputs.profile || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** Android" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** ${{ github.event.inputs.profile == 'production' && 'AAB (Play Store)' || 'APK (Testing)' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Keystore:** Auto-generated and uploaded ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Monitor build:** [Expo Dashboard](https://expo.dev)" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Build ID:** ${{ steps.build-status.outputs.build_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Note:** Fully automated self-provisioning pipeline - no manual keystore setup needed!" >> $GITHUB_STEP_SUMMARY
