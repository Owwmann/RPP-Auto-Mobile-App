name: EAS Build - Android (Expo-Managed)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile to use'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - preview
          - production
      auto_submit:
        description: 'Auto-submit to Play Store (production only)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - main
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - 'package.json'
      - 'eas.json'
      - 'app.json'

jobs:
  build:
    name: Build Android App (Expo-Managed)
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      
      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: 🔐 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: 🚀 Run EAS Build (Expo Auto-Credentials)
        run: |
          echo "🏗️ Starting Expo-managed build..."
          eas build --platform android \
            --profile ${{ github.event.inputs.profile || 'production' }} \
            --non-interactive
          echo "✅ Build completed!"
      
      - name: 📤 Submit to Play Store
        if: ${{ github.event.inputs.auto_submit == 'true' && github.event.inputs.profile == 'production' }}
        run: eas submit --platform android --latest --non-interactive
      
      - name: 📋 Build Summary
        run: |
          echo "## 🎉 Build Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ github.event.inputs.profile || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** Android" >> $GITHUB_STEP_SUMMARY
          echo "**Node Version:** 22.11.0" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** ${{ github.event.inputs.profile == 'production' && 'AAB (Play Store)' || 'APK (Testing)' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Credentials:** ✅ Expo-managed (auto-generated)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Monitor build:** [Expo Dashboard](https://expo.dev)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Note:** Expo automatically generates and manages your keystore - zero manual setup!" >> $GITHUB_STEP_SUMMARY
