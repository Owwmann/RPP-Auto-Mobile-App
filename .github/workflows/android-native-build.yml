name: Native Android Build
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🌍 Install EAS CLI
        run: npm install -g eas-cli

      - name: ⚙️ Authenticate with Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗️ Build Android APK Locally
        run: eas build --platform android --profile production --local --non-interactive --output=./app-release.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        timeout-minutes: 30

      - name: 📤 Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpp-auto-release
          path: app-release.apk
          retention-days: 30

      - name: ✅ Build Complete
        if: success()
        run: |
          echo "🎉 Build completed successfully!"
          echo "📲 Download the APK from the Artifacts section above."
          ls -lh app-release.apk