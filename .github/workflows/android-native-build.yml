name: Native Android Build
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: npm install --no-package-lock --legacy-peer-deps

      - name: 🌍 Install EAS CLI
        run: npm install -g eas-cli

      - name: ⚙️ Authenticate with Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🔨 Prebuild Android Project
        run: |
          # Create placeholder icons to avoid build errors
          mkdir -p assets
          # Create a simple 1x1 transparent PNE (base64 encoded)
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > assets/icon.png
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > assets/adaptive-icon.png
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > assets/splash.png
          # Run prebuild
          npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🔑 Generate Debug Keystore
        run: |
          # Create debug keystore for signing
          mkdir -p android/app
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 🏗️ Build Android APK Locally
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📋 Find APK
        run: |
          # Find the generated APK
          find android -name "*.apk" -type f
          # Copy to root for upload
          cp android/app/build/outputs/apk/release/app-release.apk ./app-release.apk || \
          cp android/app/build/outputs/apk/release/*.apk ./app-release.apk

      - name: 📤 Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpp-auto-release
          path: app-release.apk
          retention-days: 30

      - name: ✅ Build Complete
        if: success()
        run: |
          echo "🎉 Build completed successfully!"
          echo "📲 Download the APK from the Artifacts section above."
          ls -lh app-release.apk
