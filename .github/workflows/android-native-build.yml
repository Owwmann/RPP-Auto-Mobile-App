name: Native Android Build
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: 🌍 Install EAS CLI
        run: npm install -g eas-cli

      - name: ⚙️ Authenticate with Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🔨 Prebuild Android Project (CLEAN + OPTIMIZED)
        run: |
          # Create placeholder icons to avoid build errors
          mkdir -p assets
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > assets/icon.png
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > assets/adaptive-icon.png
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > assets/splash.png

          # FIX #2: FORCE CLEAN PREBUILD - Remove any existing broken android folder
          rm -rf android

          # Run clean prebuild with updated babel.config.js
          npx expo prebuild --platform android --clean

          # Verify android folder was created
          if [ ! -d "android" ]; then
            echo "❌ ERROR: android folder was not created by expo prebuild!"
            exit 1
          fi

          echo "✅ Android project generated successfully"
          ls -la android/
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🔧 FIX #1: Grant Gradle Execution Rights
        run: |
          cd android
          chmod +x ./gradlew
          echo "✅ Gradle wrapper is now executable"

      - name: 🏗️ FIX #3: Build Android APK with Optimized Gradle Args
        run: |
          cd android
          # FIX #3: Use --no-daemon and --stacktrace for CI environment
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        timeout-minutes: 30

      - name: 📋 Find APK
        run: |
          echo "Searching for APK files..."
          find android -name "*.apk" -type f
          # Copy to root for upload
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" ./app-release.apk
            echo "✅ APK found and copied: $APK_PATH"
          else
            echo "❌ No APK found!"
            exit 1
          fi

      - name: 📤 Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpp-auto-release
          path: app-release.apk
          retention-days: 30

      - name: ✅ Build Complete
        if: success()
        run: |
          echo "🎉 Build completed successfully!"
          echo "📲 Download the APK from the Artifacts section above."
          ls -lh app-release.apk
