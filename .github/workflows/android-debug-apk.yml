name: Android Debug APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: 📦 Install Dependencies
        run: |
          npm cache clean --force || true
          rm -rf node_modules
          npm install --force

      - name: 🏗️ Generate Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Fix settings.gradle for Expo
        run: |
          echo "Removing incompatible React Native CLI plugin..."
          echo "BEFORE:"
          cat android/settings.gradle
          # Try multiple patterns to catch all variations
          sed -i "/id.*'com\.facebook\.react\.settings'/d" android/settings.gradle
          sed -i '/id.*"com\.facebook\.react\.settings"/d' android/settings.gradle
          sed -i "/id('com\.facebook\.react\.settings')/d" android/settings.gradle
          sed -i '/id("com\.facebook\.react\.settings")/d' android/settings.gradle
          sed -i '/com\.facebook\.react\.settings/d' android/settings.gradle
          echo ""
          echo "AFTER:"
          cat android/settings.gradle
          echo ""
          if grep -q "facebook.*react.*settings" android/settings.gradle; then
            echo "ERROR: facebook.react.settings still present!"
            exit 1
          fi
          echo "✅ Patched settings.gradle for Expo SDK compatibility"

      - name: 🔨 Build Debug APK
        env:
          # Flipper Configuration (Injected via Env Vars to bypass Gradle Cache)
          ORG_GRADLE_PROJECT_FLIPPER_VERSION: "0.182.0"
          ORG_GRADLE_PROJECT_FLIPPER_SOCKET_VERSION: "0.182.0"
          ORG_GRADLE_PROJECT_FLIPPER_FRESCO_VERSION: "2.5.0"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
        timeout-minutes: 30

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
