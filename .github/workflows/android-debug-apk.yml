name: Android Debug APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Generate Android Project
        run: npx expo prebuild --platform android --clean

      - name: ⚙️ Create and Run Configuration Fix Script
        run: |
          # Create the fix script safely using cat
          cat << 'EOF' > fix_gradle_config.sh
          #!/bin/bash
          echo "🚀 Starting Android Configuration Fix..."
          
          # FIX 1: PATCH PLUGIN COMPONENT ACCESS
          PLUGIN_FILE="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ -f "$PLUGIN_FILE" ]; then
              echo "📍 Patching ExpoModulesCorePlugin..."
              perl -pi -e 's/components\.release/components.findByName("release")/g' "$PLUGIN_FILE"
          fi
          
          echo "✅ CONFIGURATION FIX COMPLETE."
          EOF
          
          # Make executable and run
          chmod +x fix_gradle_config.sh
          ./fix_gradle_config.sh

      - name: 🏗️ Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info -x lint -x lintVitalRelease

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk