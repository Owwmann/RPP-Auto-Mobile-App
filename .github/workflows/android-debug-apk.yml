name: Android Debug APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: 📦 Install dependencies
        run: |
          rm -rf node_modules package-lock.json yarn.lock
          npm install --legacy-peer-deps --no-audit

      - name: 🧹 Clean Android folder
        run: rm -rf android

      - name: 🏗️ Generate Android Project
        run: |
          npx expo prebuild --clean --platform android
          chmod +x android/gradlew

      - name: ⚙️ Configure Gradle & Fix ALL Expo modules
        run: |
          echo "═══════════════════════════════════════════════"
          echo "🔧 TCL Android 2025 Configuration Patch - Run #46"
          echo "═══════════════════════════════════════════════"

          # Add Gradle memory configuration
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.configureondemand=false" >> android/gradle.properties
      # CRITICAL FIX 1: Patch Main :expo Module FIRST
      MAIN_EXPO="node_modules/expo/android/build.gradle"
      if [ -f "$MAIN_EXPO" ]; then
        echo "📍 Patching PRIMARY expo module..."
        if ! grep -q "compileSdkVersion" "$MAIN_EXPO"; then
          # Insert android block at top of file
          cat > "${MAIN_EXPO}.tmp" << 'EOF'
android {
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34
    }
}

EOF
          cat "$MAIN_EXPO" >> "${MAIN_EXPO}.tmp"
          mv "${MAIN_EXPO}.tmp" "$MAIN_EXPO"
          echo "✅ SUCCESS: Main expo module configured for SDK 34"
        else
          echo "⚠️  SKIP: Main expo module already configured"
        fi
      else
        echo "❌ CRITICAL: Main expo build.gradle NOT FOUND"
        echo "📁 Searching for alternative paths..."
        find node_modules -name "build.gradle" -path "*/expo/android/*" | head -5
        exit 1
      fi

      # CRITICAL FIX 2: Patch ALL Other Expo Modules
      echo ""
      echo "📦 Scanning for additional expo modules..."
      PATCHED_COUNT=0
      for module in node_modules/expo-*/android/build.gradle; do
        if [ -f "$module" ]; then
          if ! grep -q "compileSdkVersion" "$module"; then
            sed -i '/^android {/a\    compileSdkVersion 34\n    buildToolsVersion "34.0.0"' "$module"
            if grep -q "defaultConfig {" "$module"; then
              sed -i '/defaultConfig {/a\        targetSdkVersion 34\n        minSdkVersion 24' "$module"
            fi
            echo "  ✅ $(basename $(dirname $(dirname $module)))"
            PATCHED_COUNT=$((PATCHED_COUNT + 1))
          fi
        fi
      done

      echo ""
      echo "═══════════════════════════════════════════════"
      echo "📊 Configuration Summary:"
      echo "   - Main expo module: ✅ Configured"
      echo "   - Additional modules patched: $PATCHED_COUNT"
      echo "═══════════════════════════════════════════════"


      - name: 🔧 Patch ExpoModulesCorePlugin (Prevent Component Error)
        run: |
          PLUGIN_FILE="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"

          if [ -f "$PLUGIN_FILE" ]; then
            echo "🔍 Patching ExpoModulesCorePlugin.gradle..."

            # Backup original
            cp "$PLUGIN_FILE" "${PLUGIN_FILE}.backup"

            # Fix line 85: components.release → components.findByName("release")
            sed -i "s/components\.release/components.findByName(\"release\")/g" "$PLUGIN_FILE"

            # Verify patch applied
            if grep -q "components.findByName" "$PLUGIN_FILE"; then
              echo "✅ SUCCESS: Plugin component access patched"
              echo "   - Original backed up to: ${PLUGIN_FILE}.backup"
            else
              echo "⚠️  WARNING: Patch verification failed"
              echo "   - Restoring from backup..."
              mv "${PLUGIN_FILE}.backup" "$PLUGIN_FILE"
              exit 1
            fi
          else
            echo "⚠️  SKIP: ExpoModulesCorePlugin.gradle not found (may not be required)"
          fi

      - name: 🏗️ Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "✅ Debug APK built successfully"

      - name: 📦 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rpp-auto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🎉 Build Summary
        run: |
          echo "🎉 Debug APK built successfully!"
          echo "📲 Download from Artifacts section above"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
