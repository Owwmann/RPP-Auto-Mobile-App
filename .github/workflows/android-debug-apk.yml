name: Android Debug APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Generate Android Project
        run: npx expo prebuild --platform android --clean

      - name: ⚙️ Create and Run Configuration Fix Script
        run: |
          # Create the fix script safely using cat
          cat << 'EOF' > fix_gradle_config.sh
          #!/bin/bash
          echo "🚀 Starting TCL Android 2025 Configuration Fix..."
          
          # FIX 1: PATCH MAIN EXPO MODULE
          EXPO_BUILD="node_modules/expo/android/build.gradle"
          if [ -f "$EXPO_BUILD" ]; then
              echo "📍 Patching :expo module..."
              echo "android { compileSdkVersion 34; defaultConfig { minSdkVersion 23; targetSdkVersion 34; } }" > temp_header.gradle
              cat "$EXPO_BUILD" >> temp_header.gradle
              mv temp_header.gradle "$EXPO_BUILD"
          fi
          
          # FIX 2: PATCH PLUGIN COMPONENT ACCESS
          PLUGIN_FILE="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ -f "$PLUGIN_FILE" ]; then
              echo "📍 Patching ExpoModulesCorePlugin..."
              perl -pi -e 's/components\.release/components.findByName("release")/g' "$PLUGIN_FILE"
          fi
          
          # FIX 3: GLOBAL SDK SWEEP
          find node_modules -path "*/android/build.gradle" -type f | while read file; do
              if ! grep -q "compileSdkVersion" "$file"; then
                  sed -i '/android {/a\    compileSdkVersion 34\n    defaultConfig {\n        minSdkVersion 23\n        targetSdkVersion 34\n    }' "$file"
              fi
          done
          echo "✅ CONFIGURATION FIX COMPLETE."
          EOF
          
          # Make executable and run
          chmod +x fix_gradle_config.sh
          ./fix_gradle_config.sh

      - name: 🏗️ Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info -x lint -x lintVitalRelease

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk