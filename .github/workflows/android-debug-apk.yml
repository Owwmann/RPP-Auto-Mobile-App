name: Android Debug APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: 📦 Install dependencies
        run: |
          rm -rf node_modules package-lock.json yarn.lock
          npm install --legacy-peer-deps --no-audit

      - name: 🧹 Clean Android folder
        run: rm -rf android

      - name: 🏗️ Generate Android Project
        run: |
          npx expo prebuild --clean --platform android
          chmod +x android/gradlew

      - name: ⚙️ Execute Gradle Configuration Fix
        run: |
          chmod +x fix_gradle_config.sh
          ./fix_gradle_config.sh
      - name: 🔧 Patch ExpoModulesCorePlugin
        run: |
          PLUGIN="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ -f "$PLUGIN" ]; then
            cp "$PLUGIN" "${PLUGIN}.bak"
            perl -pi -e 's/components\.release/components.findByName("release")/g' "$PLUGIN"
            grep -q "findByName" "$PLUGIN" && echo "✅ Plugin patched" || mv "${PLUGIN}.bak" "$PLUGIN"
          fi

      - name: 🏗️ Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "✅ Debug APK built successfully"

      - name: 📦 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rpp-auto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🎉 Build Summary
        run: |
          echo "🎉 Debug APK built successfully!"
          echo "📲 Download from Artifacts section above"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
