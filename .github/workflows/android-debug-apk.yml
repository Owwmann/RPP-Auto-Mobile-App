name: Android Debug APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: 📦 Install dependencies
        run: |
          rm -rf node_modules package-lock.json yarn.lock
          npm install --legacy-peer-deps --no-audit

      - name: 🧹 Clean Android folder
        run: rm -rf android

      - name: 🏗️ Generate Android Project
        run: |
          npx expo prebuild --clean --platform android
          chmod +x android/gradlew

      - name: ⚙️ Configure Gradle & Fix ALL Expo modules
        run: |
          echo "═══════════════════════════════════════"
          echo "🔧 Comprehensive SDK 34 Fix - Run #48"
          echo "═══════════════════════════════════════"

          # Gradle memory
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.configureondemand=false" >> android/gradle.properties

          # COMPREHENSIVE FIX: Patch ALL Expo modules (including main :expo)
          echo "🎯 Patching ALL Expo modules..."

          # Create SDK config block
          cat > /tmp/sdk_block.txt << 'ENDBLOCK'
android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34
    }
}

ENDBLOCK

          # Find ALL expo modules build.gradle files (including main expo and all expo-*)
          find node_modules -type d \( -name "expo" -o -name "expo-*" \) -print0 2>/dev/null | while IFS= read -r -d '' dir; do
            GRADLE_FILE="$dir/android/build.gradle"
            if [ -f "$GRADLE_FILE" ]; then
              # ALWAYS prepend SDK config (no conditional check)
              cat /tmp/sdk_block.txt "$GRADLE_FILE" > "${GRADLE_FILE}.new"
              mv "${GRADLE_FILE}.new" "$GRADLE_FILE"
              echo "✅ Patched: $(basename $(dirname $(dirname $dir)))/$(basename $dir)"
            fi
          done

          echo "✅ ALL Expo modules patched!"

      - name: 🔧 Patch ExpoModulesCorePlugin
        run: |
          PLUGIN="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ -f "$PLUGIN" ]; then
            cp "$PLUGIN" "${PLUGIN}.bak"
            perl -pi -e 's/components\.release/components.findByName("release")/g' "$PLUGIN"
            grep -q "findByName" "$PLUGIN" && echo "✅ Plugin patched" || mv "${PLUGIN}.bak" "$PLUGIN"
          fi

      - name: 🏗️ Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "✅ Debug APK built successfully"

      - name: 📦 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rpp-auto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🎉 Build Summary
        run: |
          echo "🎉 Debug APK built successfully!"
          echo "📲 Download from Artifacts section above"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
