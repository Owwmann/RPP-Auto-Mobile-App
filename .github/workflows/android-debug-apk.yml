name: Android Debug APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: 📦 Install dependencies
        run: |
          rm -rf node_modules package-lock.json yarn.lock
          npm install --legacy-peer-deps --no-audit

      - name: 🧹 Clean Android folder
        run: rm -rf android

      - name: 🏗️ Generate Android Project
        run: |
          npx expo prebuild --clean --platform android
          chmod +x android/gradlew

      - name: ⚙️ Configure Gradle & Fix ALL Expo modules
        run: |
          echo "═══════════════════════════════════════"
          echo "🔧 SDK 34 Config - Run #46"
          echo "═══════════════════════════════════════"
          
          # Gradle memory
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.configureondemand=false" >> android/gradle.properties

          # FIX 1: Main :expo module
          EXPO_MAIN="node_modules/expo/android/build.gradle"
          if [ -f "$EXPO_MAIN" ]; then
            if ! grep -q "compileSdkVersion" "$EXPO_MAIN"; then
              echo 'android {' > "${EXPO_MAIN}.new"
              echo '    compileSdkVersion 34' >> "${EXPO_MAIN}.new"
              echo '    defaultConfig {' >> "${EXPO_MAIN}.new"
              echo '        minSdkVersion 23' >> "${EXPO_MAIN}.new"
              echo '        targetSdkVersion 34' >> "${EXPO_MAIN}.new"
              echo '    }' >> "${EXPO_MAIN}.new"
              echo '}' >> "${EXPO_MAIN}.new"
              echo '' >> "${EXPO_MAIN}.new"
              cat "$EXPO_MAIN" >> "${EXPO_MAIN}.new"
              mv "${EXPO_MAIN}.new" "$EXPO_MAIN"
              echo "✅ Main :expo configured"
            fi
          fi

          # FIX 2: Other modules
          for mod in node_modules/expo-*/android/build.gradle; do
            if [ -f "$mod" ] && ! grep -q "compileSdkVersion" "$mod"; then
              sed -i '/^android {/a\    compileSdkVersion 34\n    buildToolsVersion "34.0.0"' "$mod"
              if grep -q "defaultConfig {" "$mod"; then
                sed -i '/defaultConfig {/a\        targetSdkVersion 34\n        minSdkVersion 24' "$mod"
              fi
            fi
          done

      - name: 🔧 Patch ExpoModulesCorePlugin
        run: |
          PLUGIN="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ -f "$PLUGIN" ]; then
            cp "$PLUGIN" "${PLUGIN}.bak"
            perl -pi -e 's/components\.release/components.findByName("release")/g' "$PLUGIN"
            grep -q "findByName" "$PLUGIN" && echo "✅ Plugin patched" || mv "${PLUGIN}.bak" "$PLUGIN"
          fi

      - name: 🏗️ Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "✅ Debug APK built successfully"

      - name: 📦 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rpp-auto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🎉 Build Summary
        run: |
          echo "🎉 Debug APK built successfully!"
          echo "📲 Download from Artifacts section above"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
