name: Android Debug APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
        timeout-minutes: 10

      - name: Patch expo-constants
        run: |
          TARGET_FILE="node_modules/expo-constants/android/build.gradle"
          if [ -f "$TARGET_FILE" ]; then
            echo "" >> "$TARGET_FILE"
            echo "android { compileSdkVersion 34; buildToolsVersion \"34.0.0\"; defaultConfig { minSdkVersion 24; targetSdkVersion 34 } }" >> "$TARGET_FILE"
          fi

      - name: Create Gradle Init Script
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sdk-versions.gradle << 'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (!compileSdkVersion) {
                              compileSdkVersion 34
                              buildToolsVersion "34.0.0"
                          }
                          if (defaultConfig && !defaultConfig.minSdkVersion) {
                              defaultConfig {
                                  minSdkVersion 24
                                  targetSdkVersion 34
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Generate Android Project
        run: npx expo prebuild --platform android --clean

      - name: Apply Post-Prebuild Fixes
        run: |
          sed -i 's/kotlinVersion = "1.8.0"/kotlinVersion = "1.9.20"/g' android/build.gradle
          sed -i 's/kotlinVersion = "1.9.24"/kotlinVersion = "1.9.20"/g' android/build.gradle
          cat >> android/gradle.properties << 'EOF'
hermesEnabled=true
newArchEnabled=false
expo.useLegacyPackageStructure=false
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.daemon=false
EOF

      - name: Inject FLIPPER_VERSION
        run: |
          echo "FLIPPER_VERSION=0.212.0" >> android/gradle.properties

      - name: Fix minSdkVersion
        run: |
          sed -i 's/minSdkVersion = 21/minSdkVersion = 24/g' android/build.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        timeout-minutes: 15

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
