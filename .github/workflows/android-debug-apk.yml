name: Android Debug APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: 📦 Install dependencies
        run: |
          rm -rf node_modules package-lock.json yarn.lock
          npm install --legacy-peer-deps --no-audit

      - name: 🧹 Clean Android folder
        run: rm -rf android

      - name: 🏗️ Generate Android Project
        run: |
          npx expo prebuild --clean --platform android
          chmod +x android/gradlew

      - name: ⚙️ Configure Gradle & Fix ALL Expo modules build.gradle
        run: |
          # Add Gradle memory configuration
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.configureondemand=false" >> android/gradle.properties
          
          # Fix expo-constants build.gradle with proper SDK configuration
          # Step 1: Add compileSdkVersion and buildToolsVersion to android {} block
          sed -i '/^android {/a\    compileSdkVersion 34\n    buildToolsVersion "34.0.0"' node_modules/expo-constants/android/build.gradle

          # Step 2: Add targetSdkVersion and minSdkVersion to defaultConfig {} block
          sed -i '/defaultConfig {/a\        targetSdkVersion 34\n        minSdkVersion 24' node_modules/expo-constants/android/build.gradle
          
          echo "✅ Gradle configured with 4GB RAM and expo-constants fixed"

      - name: 🏗️ Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "✅ Debug APK built successfully"

      - name: 📦 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rpp-auto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🎉 Build Summary
        run: |
          echo "🎉 Debug APK built successfully!"
          echo "📲 Download from Artifacts section above"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
