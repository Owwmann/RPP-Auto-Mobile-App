name: Android Debug APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install Dependencies
        run: |
          npm cache clean --force || true
          rm -rf node_modules
          npm install --legacy-peer-deps
        timeout-minutes: 10

      - name: Verify React Native
        run: |
          if [ ! -f "node_modules/react-native/index.js" ]; then
            npm install react-native --legacy-peer-deps
          fi

      - name: Generate Android Project
        run: npx expo prebuild --platform android --clean

      - name: Fix expo-constants Build Configuration
        run: |
          echo "Patching expo-constants/android/build.gradle..."
          EXPO_FILE="node_modules/expo-constants/android/build.gradle"

          if [ -f "$EXPO_FILE" ]; then
            # Prepend Android configuration to the file
            cat > /tmp/expo-fix.gradle << 'EOFFIX'
android {
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
    }
}

EOFFIX
            # Backup original
            cp "$EXPO_FILE" "$EXPO_FILE.bak"
            # Prepend the fix
            cat /tmp/expo-fix.gradle "$EXPO_FILE.bak" > "$EXPO_FILE"
            echo "✅ expo-constants patched successfully"
            echo "First 30 lines of patched file:"
            head -30 "$EXPO_FILE"
          else
            echo "❌ File not found: $EXPO_FILE"
            exit 1
          fi

      - name: Apply Post-Prebuild Fixes
        run: |
          echo "Applying Kotlin 1.9.20..."
          sed -i 's/kotlinVersion = "1.8.0"/kotlinVersion = "1.9.20"/g' android/build.gradle
          sed -i 's/kotlinVersion = "1.9.24"/kotlinVersion = "1.9.20"/g' android/build.gradle
          sed -i 's/minSdkVersion = 21/minSdkVersion = 24/g' android/build.gradle

          echo "Injecting Gradle properties..."
          echo "" >> android/gradle.properties
          echo "hermesEnabled=true" >> android/gradle.properties
          echo "newArchEnabled=false" >> android/gradle.properties
          echo "expo.useLegacyPackageStructure=false" >> android/gradle.properties
          echo "FLIPPER_VERSION=0.182.0" >> android/gradle.properties
          echo "android.minSdkVersion=24" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

          echo "Verification:"
          grep "kotlinVersion" android/build.gradle
          tail -10 android/gradle.properties

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        timeout-minutes: 20

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
