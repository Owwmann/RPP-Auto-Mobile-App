name: Android Debug APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Generate Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Fix Expo Modules SDK Configuration
        run: |
          echo "🔧 Fixing Expo modules SDK configuration..."
          # Fix expo-constants module
          EXPO_CONSTANTS_BUILD="node_modules/expo-constants/android/build.gradle"
          if [ -f "$EXPO_CONSTANTS_BUILD" ]; then
            echo "Patching $EXPO_CONSTANTS_BUILD"
            if ! grep -q "compileSdkVersion" "$EXPO_CONSTANTS_BUILD"; then
              # Add SDK configuration after 'android {' line
              sed -i '/^android {/a\    compileSdkVersion = 34\n    defaultConfig {\n        minSdkVersion 24\n        targetSdkVersion 34\n    }' "$EXPO_CONSTANTS_BUILD"
            fi
          fi
          echo "✅ Expo modules fixed!"

      - name: 🏗️ Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -x lint -x lintVitalRelease

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
