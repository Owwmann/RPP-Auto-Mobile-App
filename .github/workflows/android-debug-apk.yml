name: Android Debug APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔧 Patch expo-constants
        run: |
          echo "📝 Patching expo-constants/android/build.gradle..."
          TARGET_FILE="node_modules/expo-constants/android/build.gradle"
          if [ -f "$TARGET_FILE" ]; then
            echo "" >> "$TARGET_FILE"
            echo "android { compileSdkVersion 34; buildToolsVersion \"34.0.0\"; defaultConfig { minSdkVersion 24; targetSdkVersion 34 } }" >> "$TARGET_FILE"
            echo "✅ Patch applied successfully to $TARGET_FILE"
            tail -n 5 "$TARGET_FILE"
          else
            echo "❌ Error: $TARGET_FILE not found!"
            exit 1
          fi

      - name: 🔧 Create Gradle Init Script
        run: |
          echo "📝 Creating global Gradle init script for SDK versions..."
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sdk-versions.gradle << 'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (!compileSdkVersion) {
                              compileSdkVersion 34
                              buildToolsVersion "34.0.0"
                          }
                          if (defaultConfig && !defaultConfig.minSdkVersion) {
                              defaultConfig {
                                  minSdkVersion 24
                                  targetSdkVersion 34
                              }
                          }
                      }
                  }
              }
          }
          EOF
          echo "✅ Gradle init script created at ~/.gradle/init.d/sdk-versions.gradle"
          cat ~/.gradle/init.d/sdk-versions.gradle

      - name: 🏗️ Generate Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Inject FLIPPER_VERSION into Gradle Properties
        run: |
          echo "📝 Appending FLIPPER_VERSION to android/gradle.properties..."
          echo "" >> android/gradle.properties
          echo "# Flipper configuration injected by CI" >> android/gradle.properties
          echo "FLIPPER_VERSION=0.182.0" >> android/gradle.properties
          echo "✅ Flipper version injected successfully."
          cat android/gradle.properties

      - name: 🔧 FORCE minSdkVersion 24 in app/build.gradle
        run: |
          echo "📝 CRITICAL FIX: Forcing minSdkVersion 24 in android/app/build.gradle..."
          APP_BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$APP_BUILD_GRADLE" ]; then
            # Use sed to replace minSdkVersion 23 with 24
            sed -i 's/minSdkVersion[[:space:]]*=[[:space:]]*23/minSdkVersion = 24/g' "$APP_BUILD_GRADLE"
            sed -i 's/minSdkVersion[[:space:]]*23/minSdkVersion 24/g' "$APP_BUILD_GRADLE"
            sed -i 's/minSdk[[:space:]]*=[[:space:]]*23/minSdk = 24/g' "$APP_BUILD_GRADLE"
            sed -i 's/minSdk[[:space:]]*23/minSdk 24/g' "$APP_BUILD_GRADLE"
            echo "✅ minSdkVersion forced to 24"
            echo "📋 Verification - showing defaultConfig section:"
            grep -A 10 "defaultConfig" "$APP_BUILD_GRADLE" || echo "No defaultConfig found"
          else
            echo "❌ Error: $APP_BUILD_GRADLE not found!"
            exit 1
          fi

      - name: 🏗️ Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -x lint -x lintVitalRelease

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
